name: iOS simulator checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.suite }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        suite: [analysis, replay, interface-1, interface-2, interface-3]
    # Separate machines isolate UI state; tests stay sequential within each simulator.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Select iOS 27 iPhone simulator
        if: matrix.suite != 'replay'
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          DEVICE_ID=$(python3 - <<'PY'
          import json, os
          with open(os.environ['RUNNER_TEMP'] + '/devices.json') as file:
              runtimes = json.load(file)['devices']
          iphones = [device for runtime, devices in runtimes.items() if 'iOS-27' in runtime
                     for device in devices if device['name'].startswith('iPhone')]
          if not iphones:
              raise SystemExit('No iOS 27 iPhone simulator is available')
          print(iphones[0]['udid'])
          PY
          )
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Test analysis and iPhone flows
        if: matrix.suite != 'replay'
        env:
          TEST_RUNNER_FINN_VIDEO_FILE: ${{ github.workspace }}/tools/replay/fixtures/squat-six-reps.mp4
          TEST_RUNNER_FINN_VIDEO_POSES: ${{ github.workspace }}/tools/replay/fixtures/squat-six-reps-poses.json
          TEST_RUNNER_FINN_VIDEO_SECONDS: '12'
          TEST_RUNNER_FINN_VIDEO_EXPECTED_REPS: '6'
          TEST_RUNNER_FINN_VIDEO_OCCLUDED_FILE: ${{ github.workspace }}/tools/replay/fixtures/squat-feet-hidden.mp4
          TEST_RUNNER_FINN_VIDEO_OCCLUDED_POSES: ${{ github.workspace }}/tools/replay/fixtures/squat-feet-hidden-poses.json
        run: |
          TEST_TARGETS=$(python3 tools/ci_test_groups.py "${{ matrix.suite }}")
          test_arguments=()
          while IFS= read -r target; do
            test_arguments+=("-only-testing:$target")
          done <<< "$TEST_TARGETS"
          xcodebuild test \
            -project Finn/Finn.xcodeproj \
            -scheme Finn \
            "${test_arguments[@]}" \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Finn.xcresult" \
            -parallel-testing-enabled NO \
            -jobs 2 \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=NO
      - name: Show failed test messages
        if: failure() && matrix.suite != 'replay'
        run: |
          # The xcodebuild summary names failing tests without saying why; the result bundle does.
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Finn.xcresult" > "$RUNNER_TEMP/summary.json" || exit 0
          python3 - "$RUNNER_TEMP/summary.json" <<'PY'
          import json, sys
          summary = json.load(open(sys.argv[1]))
          for failure in summary.get("testFailures", []):
              name = failure.get("testIdentifierString") or failure.get("testName")
              print("::error title={}::{}".format(name, failure.get("failureText", "").replace("\n", " ")))
              print(json.dumps(failure, indent=2))
          PY
      - name: Check Release startup and navigation
        if: ${{ !cancelled() && matrix.suite == 'analysis' }}
        run: |
          xcodebuild test \
            -project Finn/Finn.xcodeproj \
            -scheme Finn-ReleaseSmoke \
            -configuration Release \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/Finn-Release.xcresult" \
            -parallel-testing-enabled NO \
            -jobs 2 \
            -collect-test-diagnostics never \
            -only-testing:FinnUITests/DashboardUITests/testProductionLaunchRendersAllTabsAndDestinations \
            ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Replay generated workout videos through Vision
        timeout-minutes: 30
        if: ${{ !cancelled() && matrix.suite == 'replay' }}
        run: tools/replay/test_generated_videos.sh 2>&1 | tee "$RUNNER_TEMP/replay.log"
      - name: Test validation scorer
        if: ${{ !cancelled() && matrix.suite == 'replay' }}
        run: python3 -m unittest discover -s docs/validation -p 'test_*.py'
      - name: Upload failed test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finn-test-report-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/Finn.xcresult
            ${{ runner.temp }}/Finn-Release.xcresult
            ${{ runner.temp }}/summary.json
            ${{ runner.temp }}/replay.log
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 9

  # Preserve the original required check name while reporting all independent suites.
  simulator:
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every simulator suite to pass
        env:
          SUITES_RESULT: ${{ needs.checks.result }}
        run: test "$SUITES_RESULT" = success
