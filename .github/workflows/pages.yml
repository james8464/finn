name: Publish Finn support pages
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check publication details
        run: |
          if grep -R -E 'PUBLISHER_NAME_PENDING|SUPPORT_EMAIL_PENDING|PUBLICATION_DATE_PENDING' site; then
            echo 'Add the publisher, public contact, and effective date before publication.' >&2
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
